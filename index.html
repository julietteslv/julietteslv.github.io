<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Art Portfolio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 50px 20px;
            background-color: #f7f7f7;
            color: #333;
            text-align: center;
        }
        header {
            max-width: 600px;
            margin: 0 auto 50px auto;
        }
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        p {
            color: #666;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .art-card {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            transition: transform 0.2s ease;
        }
        .art-card:hover {
            transform: translateY(-4px);
        }
        .art-card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }
        .art-title {
            margin-top: 15px;
            font-size: 1rem;
            font-weight: 600;
            color: #222;
        }
    </style>
</head>
<body>

    <header>
        <h1>Your Name</h1>
        <p>Visual Artist & Creator. Welcome to my personal portfolio showcasing my latest works and creative projects.</p>
    </header>

    <div class="gallery">
        <!-- Artwork 1 -->
        <div class="art-card">
            <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=800&q=80" alt="Artwork 1">
            <div class="art-title">Composition in Blue</div>
        </div>

        <!-- Artwork 2 -->
        <div class="art-card">
            <img src="https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=800&q=80" alt="Artwork 2">
            <div class="art-title">Abstract Horizons</div>
        </div>

        <!-- Artwork 3 -->
        <div class="art-card">
            <img src="https://images.unsplash.com/photo-1541963463532-d68292c34b19?auto=format&fit=crop&w=800&q=80" alt="Artwork 3">
            <div class="art-title">Texture Study No. 4</div>
        </div>
    </div>

</body>
</html>
